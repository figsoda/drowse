name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            allow-import-from-derivation = false
            experimental-features = ca-derivations dynamic-derivations flakes nix-command recursive-nix

      - name: Set up cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: drowse
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Nix flake check
        run: nix flake check --system ${{ matrix.system }}
